    MRC_DUPLICATED_ORDER_ID   = 403;   //Duplicate order creation
    
       //Gift code
    MRC_GIFTCODE_AREADY_USED   = 500;    //Gift code already used
    MRC_GIFTCODE_INVALIDE_CODE = 501;    //Invalid gift code
