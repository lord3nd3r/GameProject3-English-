    MRC_INVALID_PASSWORD  = 102;    //Invalid password
    MRC_INVALID_NAME      = 103;    //Invalid name
    MRC_INVALID_ROLEID    = 104;    //Invalid role ID
    MRC_INVALID_ITEMID    = 105;    //Invalid item ID
    MRC_INVALID_COPYID    = 106;    //Invalid copy ID
    MRC_INVALID_PETID     = 107;    //Invalid pet ID
    MRC_INVALID_PARTNERID = 108;    //Invalid partner ID
    MRC_INVALID_EQUIP_ID  = 109;    //Invalid equip ID
    MRC_INVALID_CARRERID  = 110;    //Invalid career ID
    MRC_INVALID_SKILL_ID  = 111;    //Invalid skill ID
    MRC_INVALID_TARGET_ID = 112;    //Invalid target ID
    MRC_INVALID_SERVER_ID = 113;    //Invalid server ID
    MRC_INVALID_GIFT_CODE = 114;    //Invalid gift code
   
       //Insufficient conditions
    MRC_NOT_ENOUGH_ACTOIN     = 200;    //Insufficient action points
    MRC_NOT_ENOUGH_MONEY      = 201;    //Insufficient money
    MRC_NOT_ENOUGH_ITEM       = 202;    //Insufficient items
    MRC_NOT_ENOUGH_TIMES      = 203;    //Insufficient times
    MRC_NOT_ENOUGH_LEVEL      = 204;    //Insufficient level
    MRC_NOT_ENOUGH_VIPLV      = 205;    //Insufficient VIP level
    MRC_ERROR_SEAL_ROLE       = 206;   //Role has been sealed
    MRC_NAME_ERROR_FMT        = 207;   //Name does not meet requirements
