    MRC_ACCOUNT_NAME_NOT_EXIST = 301;    //Account name does not exist
    MRC_ACCOUNT_NAME_ERR_FMT   = 302;    //Account name does not meet requirements
    MRC_ROLE_NAME_EXIST        = 303;    //Role name already exists
    MRC_ACCOUNT_SEALED         = 304;    //Account sealed
    MRC_ACCOUNT_WRONG_VERSION  = 305;    //Client version incorrect
    MRC_ACCOUNT_WRONG_PASSWORD = 306;    //Client version incorrect
    MRC_ROLE_NAME_MUST_UTF8    = 308;   //Name must be UTF8 encoded
